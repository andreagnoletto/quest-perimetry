name: core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Perimetry.sln -c Release
      - run: dotnet test core/Perimetry.Core.Tests -c Release --collect:"XPlat Code Coverage"
      # headset logic (pure C#, same sources Unity compiles) and a compile check of the Unity scripts
      - run: dotnet test headset/LogicTests -c Release --collect:"XPlat Code Coverage"
      - run: dotnet build headset/UnityCompileCheck -c Release
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # requirement -> implementation -> test matrix (docs/regulatory); fails on a dangling reference
      - run: python3 tools/trace/build_matrix.py --check-only
  opi-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y r-base-core r-cran-jsonlite
      - run: bash tools/opi-crosscheck/run.sh
  portal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: portal
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/perimetry_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      # the portal runs every analysis through the /core CLI
      - run: dotnet build ../core/Perimetry.Cli -c Release
      - run: npm ci
      # Phase 6 (security): a critical advisory in a production dependency fails the build; the full report is informational (portal/SECURITY.md)
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --audit-level=high || true
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
